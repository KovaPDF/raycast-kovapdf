name: mac-shots

# Store screenshots from a real Raycast window on a GitHub macOS runner.
# Inputs are invented PDFs in .github/mac-shots. The test key comes from the
# RAYCAST_SHOT_KEY secret and is typed into the password field only.
on:
  push:
    branches: [mac-shots]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Screen
        run: |
          mkdir -p shots
          brew install displayplacer cliclick || true
          displayplacer list | head -40 || true
      - name: Install and open Raycast
        timeout-minutes: 8
        continue-on-error: true
        run: |
          displayplacer "id:1 res:1920x1080 hz:60 color_depth:7 scaling:off origin:(0,0) degree:0" || true
          brew install --cask --no-quarantine raycast || brew install --cask raycast
          xattr -dr com.apple.quarantine /Applications/Raycast.app || true
          (open /Applications/Raycast.app > open.log 2>&1 &) ; sleep 30
          screencapture -x shots/01-after-open.png || true
          pgrep -fl Raycast || echo 'Raycast not running'
      - name: Allow Raycast to read the Finder selection and the screen (runner only)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          U="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          S="/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          COLS="service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags,last_modified"
          creq() { codesign -d -r- "$1" 2>&1 | sed -n 's/^designated => //p' | csreq -r- -b /tmp/cr.bin && xxd -p /tmp/cr.bin | tr -d '\n'; }
          RC=$(creq /Applications/Raycast.app); FC=$(creq /System/Library/CoreServices/Finder.app)
          echo "csreq lengths: raycast ${#RC} finder ${#FC}"
          sqlite3 "$U" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES ('kTCCServiceAppleEvents','com.raycast.macos',0,2,3,1,X'$RC',0,'com.apple.finder',X'$FC',0,$now);" || echo 'user TCC failed'
          for svc in kTCCServiceAccessibility kTCCServiceScreenCapture kTCCServicePostEvent; do
            sudo sqlite3 "$S" "INSERT OR REPLACE INTO access ($COLS) VALUES ('$svc','com.raycast.macos',0,2,3,1,0,'UNUSED',0,$now);" || echo "system TCC $svc failed"
          done
          sqlite3 "$U" "select service,client,auth_value,length(csreq) from access where client like '%raycast%';" || true
          killall tccd || true; sudo killall tccd || true
      - name: Shots only, never in the Store code: read the demo file path when Finder gives no selection
        run: |
          # On this runner Raycast cannot read the Finder selection, so the shot build reads the path from a file.
          for f in src/verify-signature.tsx src/compress-pdf.tsx src/merge-pdfs.tsx; do
            perl -0pi -e 's/getSelectedFinderItems\(\)\.catch\(\(\) => \[\]\)/getSelectedFinderItems().catch(() => []).then((x) => (x.length ? x : require("node:fs").readFileSync("\/tmp\/kova-shot-file", "utf8").split("\n").filter(Boolean).map((p: string) => ({ path: p }))))/' "$f"
            grep -c kova-shot-file "$f"
          done
      - name: Load the extension in development mode
        timeout-minutes: 6
        continue-on-error: true
        run: |
          (npx ray develop > ray-develop.log 2>&1 &) ; sleep 60
          tail -20 ray-develop.log || true
          screencapture -x shots/02-after-develop.png || true
      - name: Real commands with the test key
        timeout-minutes: 14
        continue-on-error: true
        env:
          KEY: ${{ secrets.RAYCAST_SHOT_KEY }}
        run: |
          D="$HOME/Desktop/KovaPDF demo"; mkdir -p "$D"; cp .github/mac-shots/*.pdf "$D/"
          shot() { screencapture -x "shots/$1.png" || true; }
          win() { mkdir -p shots/win; screencapture -x -R 585,163,750,475 "shots/win/$1.png" || true; }
          # walk through Raycast's first-run setup so it stops being the front app
          shot 09-setup-0
          cliclick c:1538,841; sleep 3
          cliclick kp:return; sleep 3
          for i in 3 4 5 6 7 8 9 10; do cliclick c:1418,841; sleep 3; done
          cliclick c:318,84; sleep 3; shot 09-setup-closed
          cliclick kp:esc; sleep 2
          # 1. Root search shows the four commands
          open -a Raycast; sleep 3; cliclick "t:KovaPDF"; sleep 3; shot 30-root; win 1-root-search
          cliclick kp:esc kp:esc; sleep 2
          # 2. Verify a signed PDF (first run asks for the key)
          echo "$D/Offer letter (signed).pdf" > /tmp/kova-shot-file
          open 'raycast://extensions/kovapdf/kovapdf/verify-signature'; sleep 5; shot 12-request
          cliclick c:960,410; sleep 6; shot 13-welcome
          cliclick c:960,440; sleep 1
          if [ -n "$KEY" ]; then cliclick "t:$KEY"; else echo 'no key secret'; fi
          cliclick kd:cmd kp:return ku:cmd; sleep 15; shot 31-verify; win 2-verify-signed
          cliclick kd:cmd t:k ku:cmd; sleep 2; shot 32-actions; win 3-verify-actions
          cliclick kp:esc kp:esc kp:esc; sleep 2
          # 3. Verify a PDF with no signature
          echo "$D/Team memo.pdf" > /tmp/kova-shot-file
          open 'raycast://extensions/kovapdf/kovapdf/verify-signature'; sleep 4; shot 33-request
          cliclick c:960,410; sleep 12; shot 34-verify-unsigned; win 4-verify-unsigned
          cliclick kp:esc kp:esc kp:esc; sleep 2
          # 4. Compress a PDF
          open 'raycast://extensions/kovapdf/kovapdf/compress-pdf'; sleep 4; shot 20-request
          cliclick c:960,410; sleep 1; shot 21-compressing; sleep 10; shot 22-compressed
          ls -la "$D" || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: mac-shots
          path: |
            shots/
            ray-develop.log
            metadata/
          retention-days: 3
