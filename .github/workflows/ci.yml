name: ci

# Runs in the extension's own public repository (this folder copied there).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ray build also writes raycast-env.d.ts (the generated Preferences types), which typecheck and the tests read.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # ray lint checks the author against the Raycast Store (network); ESLint and Prettier run in it too.
      - run: npm run lint
